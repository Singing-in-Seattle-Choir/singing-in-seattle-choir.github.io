title: Singing in Seattle Choir
# Used for absolute links (hreflang). Update when the custom domain is set up.
url: https://singing-in-seattle-choir.github.io
timezone: America/Los_Angeles

# Events are dated in the future; publish them anyway.
future: true

# One file per event in _events/, named YYYY-MM-DD-name.md; the date comes
# from the file name. Each event gets a page at /events/YYYY-MM-DD-name/,
# and the Events and home pages list events from the same files.
collections:
  events:
    output: true
    permalink: /events/:name/

# Links to shared photo albums on event pages (the `albums` field).
# Off while the albums are being tidied up; set to true to show them again.
show_albums: true

# Pages are in English unless they live under ru/ (see _data/i18n.yml).
defaults:
  - scope:
      path: ""
    values:
      lang: en
  - scope:
      path: ru
    values:
      lang: ru
  - scope:
      type: events
    values:
      layout: event
      nav: events

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
