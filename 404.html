<script>
  // The site used to live under /Website/ (before the repository was renamed).
  // Send old links to the same page without that prefix.

    var m = location.pathname.match(/^\/website(\/.*)?$/i);
    if (m) location.replace((m[1] || "/") + location.search + location.hash);
  })();
</script>
